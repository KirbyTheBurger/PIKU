[package]
name = "piku"
version = "0.1.1"
edition = "2024"
description = "A 16-bit CPU architecture with a custom instruction set"
license = "MIT"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
console = "0.16.4"
dhat = "0.3.3"
paste = "1.0.15"
smallvec = "1.16.4"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[profile.release]
debug = true
lto = "thin"
codegen-units = 1
panic = "abort"

[[bench]]
name = "assembler"
harness = false

[[bench]]
name = "stress"
harness = false

[lib]
bench = false

[[bin]]
name = "piku"
path = "src/main.rs"
bench = false
